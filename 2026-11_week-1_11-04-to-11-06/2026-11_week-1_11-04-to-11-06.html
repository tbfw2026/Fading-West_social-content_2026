<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>if(!/\/$|\.html$/.test(location.pathname))location.replace(location.pathname+"/"+location.search+location.hash);</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Nov. Week 1 | 2026 Social Calendar | Fading West</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@600;800&family=Montserrat:wght@400;500;600&display=swap">
<style>
/* layout: white page; masthead (logo, week, downloads) over a sticky post index; each post = head, one band per size variant with its platform mock-ups side by side, then caption + files. Single light look by request. */
:root{
  --page:#FFFFFF; --ink:#1B2235; --muted:#5E6577; --line:#E3E5EA; --tint:#F4F5F8;
  --navy:#202A44; --gold:#F1B434; --red:#AF272F;
  --app-ink:#121417; --app-muted:#6B7078; --app-line:#E4E6EA; --app-fill:#ECEDF0;
  --display:"Saira",Impact,"Arial Narrow",sans-serif;
  --body:"Montserrat",Arial,Helvetica,sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
body{background:var(--page);color:var(--ink);font:400 15px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--page)}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* site navigation: back to the schedule, plus every week */
.sitenav{background:var(--navy);color:#fff}
.sitenav .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:10px}
.sitenav a{color:#fff;text-decoration:none;font-size:13px}
.sitenav .brand{display:block;line-height:0;padding-right:14px;border-right:1px solid rgba(255,255,255,.22)}
.sitenav .brand img{height:30px;width:auto;display:block}
.sitenav .home{font:600 13px/1 var(--body);display:inline-flex;gap:7px;align-items:center;white-space:nowrap;height:34px;box-sizing:border-box;padding:0 14px 0 10px;border-radius:999px;background:rgba(255,255,255,.12);transition:background .15s}
.sitenav .home:hover{background:rgba(255,255,255,.22)}
.sitenav .home .ic{width:16px;height:16px;stroke-width:2.2;transition:transform .15s}
.sitenav .home:hover .ic{transform:translateX(-2px)}
@media (prefers-reduced-motion:reduce){.sitenav .home,.sitenav .home .ic{transition:none}}
.sitenav .weeks{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.sitenav .weeks a,.sitenav .weeks span{height:34px;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;padding:0 14px;font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;border:1px solid rgba(255,255,255,.28);border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sitenav .weeks .ic{width:15px;height:15px;stroke-width:2.4}
.sitenav .weeks .prev{padding-left:10px}.sitenav .weeks .next{padding-right:10px}
.sitenav .weeks .off{opacity:.35;cursor:default}
.sitenav .weeks a:hover{border-color:#fff}

.sitenav a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (max-width:640px){.sitenav .home{margin-left:auto}.sitenav .brand{border-right:0;padding-right:0}.sitenav .weeks{margin-left:0;width:100%}.sitenav .weeks>*{flex:1 1 calc(50% - 6px);justify-content:center}}

/* masthead */
.mast .wrap{padding-block:28px 24px;display:flex;flex-wrap:wrap;gap:22px 32px;align-items:flex-end;justify-content:space-between}
.mast .intro{min-width:0;max-width:640px}
.logo{height:44px;width:auto;display:block;margin-bottom:20px}
.eb{font:600 12px/1.2 var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--red)}
h1{font:800 clamp(32px,5vw,48px)/1 var(--display);text-transform:uppercase;color:var(--navy);margin:8px 0 0;text-wrap:balance}
.lede{margin:12px 0 0;color:var(--muted);max-width:62ch}
.docs{display:flex;flex-wrap:wrap;gap:10px}

/* buttons */
.btn{font:600 14px/1 var(--body);border-radius:6px;padding:11px 16px;cursor:pointer;border:1px solid var(--navy);background:var(--navy);color:#fff;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.btn:hover{background:#2B3858}
a.btn{text-decoration:none}
.btn.ghost{background:var(--page);color:var(--navy);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--navy)}
.btn.sm{padding:7px 11px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn .ic{width:16px;height:16px;stroke-width:2}
button:focus-visible,a:focus-visible,.track:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* post index */
.idx{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--page);border-block:1px solid var(--line)}
.navrow{display:flex;gap:12px;align-items:center;padding-block:10px}
.chipsrow{display:flex;gap:8px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:thin}
.seg{flex:none;display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--tint)}
.seg button{all:unset;cursor:pointer;padding:7px 13px;border-radius:999px;font:600 12.5px/1 var(--body);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.seg button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.idx a{flex:0 0 auto;display:flex;gap:8px;align-items:baseline;padding:7px 12px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink);font-size:13px;white-space:nowrap}
.idx a:hover{border-color:var(--navy)}
.idx a b{font:600 11px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.idx a.on{border-color:var(--navy);background:var(--tint)}
.jump-wrap{display:none;flex:1;min-width:0;position:relative}
.jump-wrap select{width:100%;appearance:none;-webkit-appearance:none;font:600 15px/1.2 var(--body);color:var(--navy);background:var(--tint);border:1px solid var(--line);border-radius:8px;padding:11px 38px 11px 12px;min-height:44px;text-overflow:ellipsis}
.jump-wrap select:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.jump-wrap::after{content:"";position:absolute;right:15px;top:50%;width:8px;height:8px;border-right:2px solid var(--navy);border-bottom:2px solid var(--navy);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:760px){
  .chipsrow{display:none}
  .jump-wrap{display:block}
  .navrow{gap:8px}
  .seg button{padding:12px 11px;font-size:13px}
}

/* posts */
main .wrap{padding-block:8px 72px}
.disclaim{font-size:12.5px;color:var(--muted);margin:18px 0 0}
.post{padding-block:40px;border-bottom:1px solid var(--line);scroll-margin-top:64px;display:grid;gap:30px}
.post:last-of-type{border-bottom:0}
.post-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;align-items:flex-end}
.post-head>div{min-width:0}
h2{font:800 clamp(20px,2.4vw,24px)/1.08 var(--display);text-transform:uppercase;color:var(--navy);margin:6px 0 0;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip.posted{background:var(--red);color:#fff;font-weight:600}
.chip.scheduled{background:transparent;box-shadow:inset 0 0 0 1.5px var(--navy);color:var(--navy);font-weight:600}
.chip{font:500 12.5px/1 var(--body);padding:7px 10px;border-radius:999px;background:var(--tint);color:var(--ink);font-variant-numeric:tabular-nums}
.variant{display:grid;gap:18px}
.vbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.size{font:600 13px/1 var(--display);letter-spacing:.06em;color:var(--navy);border:1.5px solid var(--navy);border-radius:4px;padding:5px 8px;font-variant-numeric:tabular-nums}
.vbar .lbl{font-weight:600}
.vbar .where{color:var(--muted);font-size:13px;margin-left:auto}
.mocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),340px));gap:30px 22px;justify-content:start;align-items:start}
.mock{display:grid;gap:10px;min-width:0}
.mock-lbl{font-size:13px;color:var(--muted)}
.mock-lbl b{color:var(--ink);font-weight:600}

/* app chrome (generic, not platform artwork) */
.app{background:#fff;color:var(--app-ink);font:400 14px/1.4 var(--ui);border:1px solid var(--app-line);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(20,28,48,.05),0 12px 28px -14px rgba(20,28,48,.22)}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ml{margin-left:auto}
.row{display:flex;align-items:center}
.av{border-radius:50%;object-fit:cover;flex:none;display:block}
.who{display:grid;line-height:1.25;min-width:0}
.who b{font-weight:600}
.who span{font-size:12.5px;color:var(--app-muted);display:flex;gap:4px;align-items:center}
.who span .ic{width:12px;height:12px;stroke-width:2}
.more{all:unset;cursor:pointer;color:var(--app-muted)}
.more:focus-visible{outline:2px solid var(--gold)}
.full{white-space:pre-line}
.media{position:relative;aspect-ratio:4/5;background:var(--app-fill);max-width:100%;overflow:hidden}
.media img,.media video{width:100%;height:100%;object-fit:cover;display:block}
.track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;scroll-behavior:smooth}
.track::-webkit-scrollbar{display:none}
.track img{flex:0 0 100%;scroll-snap-align:start}
.count{position:absolute;top:10px;right:10px;background:rgba(18,20,23,.72);color:#fff;font:500 12px/1 var(--ui);padding:5px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.nav{position:absolute;top:50%;translate:0 -50%;width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#121417;display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25);padding:0}
.nav .ic{width:16px;height:16px;stroke-width:2.4}
.nav.prev{left:8px}.nav.next{right:8px}

/* instagram-style feed */
.ig-head{padding:10px 12px;gap:10px}
.ig-head .av{width:32px;height:32px;box-shadow:0 0 0 1px var(--app-line)}
.ig-head b{font-size:13.5px;font-weight:600}
.ig-act{position:relative;padding:9px 12px 4px;gap:14px}
.dots{position:absolute;left:50%;translate:-50% 0;display:flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:#C9CBD0}
.dots i.on{background:#121417}
.ig-cap{padding:4px 12px 0;font-size:13.5px}
.ig-cap b{font-weight:600}
.ig-date{padding:6px 12px 14px;font-size:11.5px;color:var(--app-muted)}

/* facebook-style feed */
.fb-head{padding:12px 12px 8px;gap:10px}
.fb-head .av{width:40px;height:40px}
.fb-head .who b{font-size:14.5px}
.fb-text,.li-text{padding:0 12px 10px;font-size:14.5px}
.fb-text .more{font-weight:600}
.foot{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-top:1px solid var(--app-line);margin:0 12px;padding:4px 0}
.act{display:flex;gap:6px;align-items:center;justify-content:center;padding:8px 2px;font:600 12.5px/1 var(--ui);color:var(--app-muted)}
.act .ic{width:19px;height:19px}
.fb-meta{padding:10px 12px 8px;font-size:12.5px;color:var(--app-muted)}

/* linkedin-style feed */
.li-head{padding:12px 12px 8px;gap:10px;align-items:flex-start}
.li-head .av{width:44px;height:44px;border-radius:4px}
.li-head .who b{font-size:14px}
.follow{font:600 14px/1 var(--ui);color:var(--app-ink);display:flex;gap:4px;align-items:center;white-space:nowrap}
.follow .ic{width:16px;height:16px;stroke-width:2.2}
.li-foot .act{flex-direction:column;gap:5px;font-size:11.5px}

/* multi-image grids */
.gal{display:grid;gap:2px;background:#fff}
.gal .r{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px}
.tile{all:unset;position:relative;display:block;cursor:zoom-in;background:var(--app-fill);overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .plus{position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;font:600 24px/1 var(--ui)}
.tile:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}

/* vertical: stories and reels */
.vert{position:relative;aspect-ratio:9/16;max-width:100%;background:#000;color:#fff;border-radius:16px;overflow:hidden;font:400 13.5px/1.35 var(--ui);text-shadow:0 1px 2px rgba(0,0,0,.35);box-shadow:0 12px 28px -14px rgba(20,28,48,.35)}
.vert>img,.vert>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.vert video{cursor:pointer}
.vert>img.st-f{opacity:0}
.vert>img.st-f.on{opacity:1}
.vert[data-story]{cursor:pointer}
.vert[data-story]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bars i.done{background:#fff}
.shade-t,.shade-b{position:absolute;left:0;right:0;pointer-events:none}
.shade-t{top:0;height:20%;background:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,0))}
.shade-b{bottom:0;height:34%;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.55))}
.st-top{position:absolute;inset:0 0 auto;padding:8px 10px;pointer-events:none}
.bars{display:flex;gap:3px}
.bars i{flex:1;height:2px;border-radius:2px;background:rgba(255,255,255,.4)}
.bars i.on{background:linear-gradient(90deg,#fff 45%,rgba(255,255,255,.4) 45%)}
.st-head{margin-top:9px;gap:8px}
.st-head .av{width:30px;height:30px}
.st-head b{font-size:13px;font-weight:600}
.st-head .t{color:rgba(255,255,255,.75);font-size:13px}
.st-head .ic{width:20px;height:20px}
.st-bot{position:absolute;inset:auto 0 0;padding:12px 12px 14px;gap:12px;pointer-events:none}
.pill{flex:1;border:1px solid rgba(255,255,255,.75);border-radius:999px;padding:10px 14px;font-size:13px;color:rgba(255,255,255,.92)}
.rl-top{position:absolute;inset:0 0 auto;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font:700 18px/1 var(--ui);pointer-events:none}
.rail{position:absolute;right:10px;bottom:92px;display:grid;gap:20px;justify-items:center;pointer-events:none}
.rail .ic{width:26px;height:26px;stroke-width:1.9;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.rl-bot{position:absolute;left:12px;right:58px;bottom:14px;display:grid;gap:8px;pointer-events:none}
.rl-user{gap:8px;min-width:0}
.rl-user .av{width:30px;height:30px}
.rl-user b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fol{border:1px solid rgba(255,255,255,.8);border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:600}
.rl-cap{font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rl-aud{gap:6px;font-size:12px;min-width:0}
.rl-aud .ic{width:14px;height:14px}
.snd{position:absolute;top:46px;right:10px;z-index:3;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 8px;border:0;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font:600 12px/1 var(--ui);cursor:pointer;text-shadow:none}
.snd .ic{width:17px;height:17px;stroke-width:2}
.snd[aria-pressed="true"] span{display:none}
.snd[aria-pressed="true"]{padding:0 7px}
.snd:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.li-vid .snd{top:auto;bottom:10px;right:auto;left:10px}
.stage .vert .snd{top:12px}
.paused{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.paused span{width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center}
.paused .ic{width:26px;height:26px;fill:#fff;stroke:none}
.li-vid .paused span{width:48px;height:48px}

/* desktop previews: a plain browser window around each app's desktop layout */
.mocks.dk{grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr))}
.desk{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--dbg);box-shadow:0 12px 28px -16px rgba(20,28,48,.28);max-width:100%}
.desk-bar{height:24px;background:#EEF0F3;border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center;padding:0 10px}
.desk-bar i{width:8px;height:8px;border-radius:50%;background:#CDD0D6}
.desk-body{padding:18px 14px;display:grid;justify-items:center}
.desk-body.flush{padding:0;display:block}
.dk-card{background:#fff;color:var(--app-ink);font:400 14px/1.4 var(--ui);width:100%;overflow:hidden}
.ig-d{max-width:470px;border-bottom:1px solid var(--app-line);padding-bottom:12px}
.ig-d .ig-head{padding:2px 0 10px}
.ig-d .media{border-radius:4px;outline:1px solid var(--app-line)}
.ig-d .ig-act{padding:10px 0 4px}
.ig-d .ig-cap{padding:4px 0 0}
.dk-muted{color:var(--app-muted);font-size:13.5px;margin-left:4px}
.ig-add{padding:8px 0 0;color:var(--app-muted);font-size:13.5px}
.fb-d{max-width:500px;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.fb-d .fb-text{font-size:15px}
.li-d{max-width:555px;border-radius:8px;border:1px solid #DFDEDA}
.dkfoot .act{flex-direction:row;gap:6px;font-size:13.5px}
.stage{position:relative;aspect-ratio:4/3;width:100%;display:flex;justify-content:center;align-items:center;gap:14px;overflow:hidden}
.stage.dark{background:#18191B}
.stage.light{background:#fff}
.stage>*{flex:none}
.stage .vert{height:92%;width:auto;aspect-ratio:9/16;border-radius:10px;box-shadow:none}
.ghost-st{height:58%;aspect-ratio:9/16;border-radius:8px;background:#2B2D31;flex:none}
.snav{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center;color:#121417;flex:none}
.snav .ic{width:16px;height:16px;stroke-width:2.4}
.sx{position:absolute;top:10px;right:12px;color:#fff}
.vert.norail .rl-bot{right:12px}
.rail-out{display:grid;gap:18px;align-self:flex-end;margin-bottom:5%;color:var(--app-ink)}

/* posts whose artwork isn't in the kit yet */
.pending{border:1.5px dashed var(--line);border-radius:10px;padding:28px 24px;display:grid;gap:6px;background:var(--tint)}
.pending b{font:600 13px/1.2 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--navy)}
.pending span{color:var(--muted);font-size:14px;max-width:70ch}

/* caption + files */
.post-foot{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:820px){.post-foot{grid-template-columns:1fr}}
.panel{min-width:0}
.panel h3{font:600 12px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.cap-box{background:var(--tint);border-radius:8px;padding:16px 18px;white-space:pre-wrap;font-size:14.5px;line-height:1.6;overflow-wrap:anywhere}
.cap-pl{font:600 14px/1.2 var(--body);color:var(--navy);margin:18px 0 8px}
.panel h3+.cap-pl{margin-top:0}
.cap-meta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.fgroup{display:grid;gap:0;margin-bottom:16px}
.fgroup-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600;padding-bottom:8px}
.frow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.frow img{width:34px;aspect-ratio:4/5;object-fit:cover;border-radius:3px;display:block;background:var(--tint)}
.frow img.tall{aspect-ratio:9/16}
.fname{font-size:12px;overflow-wrap:anywhere;line-height:1.35}
.fname small{display:block;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.notes{margin-top:8px;border-left:3px solid var(--red);padding:2px 0 2px 14px;font-size:13.5px}
.notes ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}

<script>
(function(){
const D=JSON.parse(document.getElementById('kit-data').textContent);
const A=D.account;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(id,cls)=>`<svg class="ic${cls?' '+cls:''}" aria-hidden="true"><use href="#i-${id}"></use></svg>`;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const GAL={}; let galN=0;
const cap=(p,pl)=>(p.captions&&p.captions[pl])||p.caption||'';

/* caption preview: first n characters, collapsed to one paragraph, with the app's "more" link */
function capPv(text,n,label,prefix){
  const flat=text.replace(/\s*\n+\s*/g,' ').trim();
  const pre=prefix?`<b>${esc(prefix)}</b> `:'';
  if(flat.length<=n) return `${pre}<span class="full">${esc(text)}</span>`;
  let cut=flat.slice(0,n); cut=cut.slice(0,cut.lastIndexOf(' ')).replace(/[.,;:!?]+$/,'');
  return `${pre}<span class="short">${esc(cut)}… <button type="button" class="more" data-more>${label}</button></span><span class="full" hidden>${esc(text)}</span>`;
}
const img=(f,cls)=>`<img${cls?` class="${cls}"`:''} src="${esc(f.preview)}" alt="${esc(f.alt)}" decoding="async">`;
const av=(cls)=>`<img class="av${cls?' '+cls:''}" src="${esc(A.avatar)}" alt="">`;

function igMedia(files){
  if(files.length===1) return `<div class="media">${img(files[0])}</div>`;
  return `<div class="media" data-car><div class="track" tabindex="0" aria-label="Carousel, ${files.length} slides. Scroll sideways or use the arrows.">${files.map(f=>img(f)).join('')}</div>
  <span class="count">1/${files.length}</span>
  <button type="button" class="nav prev" aria-label="Previous slide" hidden>${ic('chev-l')}</button>
  <button type="button" class="nav next" aria-label="Next slide">${ic('chev-r')}</button></div>`;
}
/* multi-image grid: rows = [[tiles, aspect], ...]; last visible tile shows +N */
function gal(files,rows){
  const g='g'+(galN++); GAL[g]=files;
  let i=0; const shown=rows.reduce((a,r)=>a+r[0],0);
  const html=rows.map(([k,ar])=>`<div class="r">${Array.from({length:k},()=>{const j=i++; const f=files[j]; const extra=(j===shown-1&&files.length>shown)?`<span class="plus">+${files.length-shown}</span>`:'';
    return `<button type="button" class="tile" style="aspect-ratio:${ar}" data-gal="${g}" data-i="${j}" aria-label="Open slide ${j+1} of ${files.length}">${img(f)}${extra}</button>`;}).join('')}</div>`).join('');
  return `<div class="gal">${html}</div>`;
}
function fbMedia(files){
  const n=files.length;
  if(n===1) return `<div class="media">${img(files[0])}</div>`;
  if(n===2) return gal(files,[[2,'4/5']]);
  if(n===3) return gal(files,[[1,'1/1'],[2,'1/1']]);
  if(n===4) return gal(files,[[1,'1/1'],[3,'1/1']]);
  return gal(files,[[2,'4/5'],[3,'1/1']]);
}
function liMedia(files){
  const n=files.length;
  if(n===1) return `<div class="media">${img(files[0])}</div>`;
  if(n===2) return gal(files,[[2,'4/5']]);
  return gal(files,[[1,'1/1'],[Math.min(3,n-1),'1/1']]);
}
const vid=(v,f)=>`<video muted loop playsinline preload="metadata" poster="${esc(f?f.poster:v.poster)}" src="${esc((f||v.files[0]).file)}" aria-label="${esc((f||v.files[0]).alt)}. Select to play or pause."></video><div class="paused"${reduce?'':' hidden'}><span>${ic('play')}</span></div><button type="button" class="snd" aria-label="Turn sound on" aria-pressed="false">${ic('muted')}<span>Tap for sound</span></button>`;

const R={
 igFeed:(p,v)=>`<div class="app">
   <div class="row ig-head">${av()}<b>${esc(A.handle)}</b>${ic('dots','ml')}</div>
   ${igMedia(v.files)}
   <div class="row ig-act">${ic('heart')}${ic('comment')}${ic('send')}${v.files.length>1?`<span class="dots">${v.files.map((_,i)=>`<i${i?'':' class="on"'}></i>`).join('')}</span>`:''}${ic('bookmark','ml')}</div>
   <div class="ig-cap">${capPv(cap(p,'ig'),125,'more',A.handle)}</div>
   <div class="ig-date">${esc(p.dateLong)}</div></div>`,
 fbFeed:(p,v)=>`<div class="app">
   <div class="row fb-head">${av()}<div class="who"><b>${esc(A.name)}</b><span>${esc(p.dateShort)} · ${ic('globe')}</span></div>${ic('dots','ml')}</div>
   <div class="fb-text">${capPv(cap(p,'fb'),160,'See more')}</div>
   ${fbMedia(v.files)}
   <div class="foot"><span class="act">${ic('like')}Like</span><span class="act">${ic('comment')}Comment</span><span class="act">${ic('share')}Share</span></div></div>`,
 liFeed:(p,v)=>`<div class="app">
   <div class="row li-head">${av()}<div class="who"><b>${esc(A.name)}</b><span>${esc(p.dateShort)} · ${ic('globe')}</span></div><span class="follow ml">${ic('plus')}Follow</span></div>
   <div class="li-text">${capPv(cap(p,'li'),210,'more')}</div>
   ${liMedia(v.files)}
   <div class="foot li-foot"><span class="act">${ic('like')}Like</span><span class="act">${ic('comment')}Comment</span><span class="act">${ic('repost')}Repost</span><span class="act">${ic('send')}Send</span></div></div>`,
 igStory:(p,v)=>`<div class="vert"${v.files.length>1?` data-story="0" tabindex="0" role="button" aria-label="Story, ${v.files.length} frames. Select to see the next frame."`:''}>${v.files.map((f,i)=>img(f,i?'st-f':'st-f on')).join('')}<div class="shade-t"></div><div class="shade-b"></div>
   <div class="st-top"><div class="bars">${v.files.map((_,i)=>`<i${i?'':' class="on"'}></i>`).join('')}</div>
   <div class="row st-head">${av()}<b>${esc(A.handle)}</b><span class="t">Now</span>${ic('dots','ml')}${ic('x')}</div></div>
   <div class="row st-bot"><span class="pill">Send message</span>${ic('heart')}${ic('send')}</div></div>`,
 fbStory:(p,v)=>`<div class="vert">${img(v.files[0])}<div class="shade-t"></div><div class="shade-b"></div>
   <div class="st-top"><div class="bars">${v.files.map((_,i)=>`<i${i?'':' class="on"'}></i>`).join('')}</div>
   <div class="row st-head">${av()}<b>${esc(A.name)}</b><span class="t">Just now</span>${ic('dots','ml')}${ic('x')}</div></div>
   <div class="row st-bot"><span class="pill">Reply…</span>${ic('like')}${ic('heart')}</div></div>`,

   <div class="row rl-aud">${ic('note')}<span>${esc(A.name)} · Original audio</span></div></div></div>`,
 reel:(p,v)=>`<div class="vert">${vid(v)}<div class="shade-t"></div><div class="shade-b"></div>
   <div class="rl-top"><span>Reels</span>${ic('camera')}</div>
   <div class="rail">${ic('heart')}${ic('comment')}${ic('send')}${ic('dots')}</div>
   <div class="rl-bot"><div class="row rl-user">${av()}<b>${esc(A.handle)}</b><span class="fol">Follow</span></div>

   <div class="row rl-aud">${ic('note')}<span>${esc(A.handle)} · Original audio</span></div></div></div>`,
 liVideo:(p,v)=>`<div class="app">

};
const PLACE={
 image:[['Instagram','Feed','igFeed'],['Facebook','Feed','fbFeed'],['LinkedIn','Feed','liFeed']],
 carousel:[['Instagram','Feed carousel','igFeed'],['Facebook','Feed, multi-photo','fbFeed'],['LinkedIn','Feed, multi-image','liFeed']],
 story:[['Instagram, Facebook','Story','igStory']],
 reel:[['Instagram, Facebook','Reels','reel'],['LinkedIn','Feed video, 4:5 crop shown','liVideo']]
};
const desk=(bg,body,flush)=>`<div class="desk" style="--dbg:${bg}"><div class="desk-bar"><i></i><i></i><i></i></div><div class="desk-body${flush?' flush':''}">${body}</div></div>`;
const igActs=v=>`<div class="row ig-act">${ic('heart')}${ic('comment')}${ic('send')}${v.files.length>1?`<span class="dots">${v.files.map((_,i)=>`<i${i?'':' class="on"'}></i>`).join('')}</span>`:''}${ic('bookmark','ml')}</div>`;
const liHead=p=>`<div class="row li-head">${av()}<div class="who"><b>${esc(A.name)}</b><span>${esc(p.dateShort)} · ${ic('globe')}</span></div><span class="follow ml">${ic('plus')}Follow</span></div>`;
const liFoot=`<div class="foot li-foot dkfoot"><span class="act">${ic('like')}Like</span><span class="act">${ic('comment')}Comment</span><span class="act">${ic('repost')}Repost</span><span class="act">${ic('send')}Send</span></div>`;
const RD={
 igFeed:(p,v)=>desk('#FFFFFF',`<div class="dk-card ig-d"><div class="row ig-head">${av()}<b>${esc(A.handle)}</b><span class="dk-muted">• ${esc(p.dateShort)}</span>${ic('dots','ml')}</div>
   ${igMedia(v.files)}${igActs(v)}<div class="ig-cap">${capPv(cap(p,'ig'),125,'more',A.handle)}</div><div class="ig-add">Add a comment…</div></div>`),
 fbFeed:(p,v)=>desk('#F0F2F5',`<div class="dk-card fb-d"><div class="row fb-head">${av()}<div class="who"><b>${esc(A.name)}</b><span>${esc(p.dateShort)} · ${ic('globe')}</span></div>${ic('dots','ml')}</div>
   <div class="fb-text">${capPv(cap(p,'fb'),250,'See more')}</div>${fbMedia(v.files)}
   <div class="foot dkfoot"><span class="act">${ic('like')}Like</span><span class="act">${ic('comment')}Comment</span><span class="act">${ic('share')}Share</span></div></div>`),
 liFeed:(p,v)=>desk('#F4F2EE',`<div class="dk-card li-d">${liHead(p)}<div class="li-text">${capPv(cap(p,'li'),230,'more')}</div>${liMedia(v.files)}${liFoot}</div>`),
 liVideo:(p,v)=>desk('#F4F2EE',`<div class="dk-card li-d">${liHead(p)}<div class="li-text">${capPv(cap(p,'li'),230,'more')}</div><div class="media li-vid">${vid(v,v.liFile)}</div>${liFoot}</div>`),
 igStory:(p,v)=>desk('#18191B',`<div class="stage dark"><span class="ghost-st"></span><span class="snav">${ic('chev-l')}</span>${R.igStory(p,v)}<span class="snav">${ic('chev-r')}</span><span class="ghost-st"></span><span class="sx">${ic('x')}</span></div>`,true),
 fbStory:(p,v)=>desk('#18191B',`<div class="stage dark"><span class="ghost-st"></span><span class="snav">${ic('chev-l')}</span>${R.fbStory(p,v)}<span class="snav">${ic('chev-r')}</span><span class="ghost-st"></span><span class="sx">${ic('x')}</span></div>`,true),
 reel:(p,v)=>desk('#FFFFFF',`<div class="stage light"><div class="vert norail">${vid(v)}<div class="shade-t"></div><div class="shade-b"></div>
   <div class="rl-bot"><div class="row rl-user">${av()}<b>${esc(A.handle)}</b><span class="fol">Follow</span></div>
   <div class="rl-cap">${esc(cap(p,'ig').split('\n')[0])}</div>
   <div class="row rl-aud">${ic('note')}<span>${esc(A.handle)} · Original audio</span></div></div></div>
   <div class="rail-out">${ic('heart')}${ic('comment')}${ic('send')}${ic('bookmark')}${ic('dots')}</div></div>`,true)
};
const mb=b=>(b/1048576).toFixed(1)+' MB';

/* site navigation */
if(D.sitenav){const sn=document.getElementById('sitenav'); const ext=/^https?:/.test(D.sitenav.home)?' target="_blank" rel="noopener"':'';
  sn.innerHTML=`<div class="wrap"><a class="brand" href="${esc(D.sitenav.home)}"${ext}><img src="logo_fw_white.png" alt="Fading West"></a><a class="home" href="${esc(D.sitenav.home)}"${ext} aria-label="Back to all weeks">${ic('arrow-l')}All weeks</a><div class="weeks">${(()=>{const W=D.sitenav.weeks, k=W.findIndex(w=>w.current), p=W[k-1], n=W[k+1];
    const btn=(w,label,cls)=>w?`<a class="${cls}" href="${esc(w.href)}"${ext} title="${esc(w.dates)}">${label}</a>`:`<span class="${cls} off" aria-disabled="true">${label}</span>`;
    return btn(p,`${ic('chev-l')}Previous week`,'prev')+btn(n,`Next week${ic('chev-r')}`,'next');})()}</div></div>`;
  sn.hidden=false;}

/* masthead + index */
document.getElementById('mast').innerHTML=`<div class="intro">
  <h1>${esc(D.title)}</h1>
  ${D.lede?`<p class="lede">${esc(D.lede)}</p>`:''}</div>
  <div class="docs">${D.docs.map(d=>d.url?`<a class="btn${d.primary?'':' ghost'}" href="${esc(d.url)}" target="_blank" rel="noopener">${ic('ext')}${esc(d.label)}</a>`:`<button type="button" class="btn${d.primary?'':' ghost'}" data-file="${esc(d.file)}"${d.b64?` data-b64="${esc(d.b64)}"`:''}>${ic('down')}${esc(d.label)}</button>`).join('')}</div>`;
document.getElementById('idx').innerHTML=D.posts.map(p=>`<a href="#${p.id}" data-id="${p.id}"><b>Post ${p.num}</b>${esc(p.day)} · ${esc(p.title)}</a>`).join('');
const jump=document.getElementById('jump');
jump.innerHTML=D.posts.map(p=>`<option value="${p.id}">${esc(p.day.replace(/^\w+\.,\s*/,''))} · ${esc(p.title)}</option>`).join('');
jump.addEventListener('change',()=>{const el=document.getElementById(jump.value); if(el){lock=Date.now()+1200; setActive(jump.value); el.scrollIntoView({behavior:reduce?'auto':'smooth'}); history.replaceState(null,'','#'+jump.value);}});

/* posts */
document.getElementById('posts').innerHTML=D.posts.map((p,pi)=>{
  const plats=v=>[...new Set(PLACE[v.kind].flatMap(x=>x[0].split(', ')))].join(', ');
  const variants=p.variants.map((v,vi)=>`<div class="variant">
    <div class="mocks" data-pi="${pi}" data-vi="${vi}"></div></div>`).join('');
  const files=p.variants.map((v,vi)=>`<div class="fgroup"><div class="fgroup-h"><span>${esc(v.size)}</span>${v.zip?`<button type="button" class="btn sm" data-zip="${p.id}:${vi}">${ic('down')}All ${v.files.length} slides (.zip)</button>`:''}</div>
    ${[...v.files,...(v.liFile?[v.liFile]:[])].map(f=>`<div class="frow"><img class="${v.kind==='story'||v.kind==='reel'?'tall':''}" src="${esc(f.thumb||f.preview||v.poster)}" alt=""><div class="fname">${esc(f.file)}<small>${esc(f.type)} · ${mb(f.bytes)}${f.note?' · '+esc(f.note):''}</small></div><button type="button" class="btn ghost sm" data-file="${esc(f.file)}" aria-label="Download ${esc(f.file)}">${ic('down')}Download</button></div>`).join('')}</div>`).join('');
  const n=p.caption.length;
  const PL={ig:'Instagram',fb:'Facebook',li:'LinkedIn'};
  const capBlock=(id,txt,label)=>`${label?`<h4 class="cap-pl">${label}</h4>`:''}<div class="cap-box" id="${id}">${esc(txt)}</div>
     <div class="cap-meta"><span>${txt.length.toLocaleString('en-US')} characters${label?'':'. Instagram allows 2,200 and LinkedIn 3,000'}.</span><button type="button" class="btn ghost sm" data-copy="${id}">${ic('copy')}Copy${label?' '+label:''} caption</button></div>`;
  const capHTML=p.captions?`<h3>Captions</h3>`+Object.keys(PL).filter(k=>p.captions[k]).map(k=>capBlock(`${p.id}-cap-${k}`,p.captions[k],PL[k])).join(''):null;
  return `<article class="post" id="${p.id}" aria-labelledby="${p.id}-t">
   <div class="post-head"><div><div class="eb">Post ${p.num} · ${esc(p.day)}</div><h2 id="${p.id}-t">${esc(p.title)}</h2></div>
   <div class="chips">${[...p.chips.filter(c=>c!=='Posted'&&c!=='Scheduled'),...new Set(p.variants.flatMap(v=>v.liFile?[v.size,v.liFile.size]:[v.size]))].map(c=>`<span class="chip">${esc(c)}</span>`).join('')}${['Scheduled','Posted'].filter(c=>p.chips.includes(c)).map(c=>`<span class="chip ${c.toLowerCase()}">${c}</span>`).join('')}</div></div>
   ${p.variants.length?variants:`<div class="pending"><b>Artwork not in this kit yet</b><span>${esc(p.pending||'Files will be added once the artwork is final.')}</span></div>`}
   <div class="post-foot">
    <div class="panel">${capHTML||`<h3>Caption</h3>${n?capBlock(`${p.id}-cap`,p.caption,''):`<div class="cap-box">Caption not written yet.</div>`}`}</div>
    <div class="panel"><h3>Files</h3>${files||'<p class="fname" style="font-size:13px;color:var(--muted);margin:0 0 16px">No files yet.</p>'}
     ${p.notes&&p.notes.length?`<div class="notes"><strong>Before posting</strong><ul>${p.notes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}</div>
   </div></article>`;
}).join('');

/* carousels */
function initCarousels(){document.querySelectorAll('[data-car]').forEach(m=>{
  const t=m.querySelector('.track'), n=t.children.length, cnt=m.querySelector('.count'), pv=m.querySelector('.prev'), nx=m.querySelector('.next');
  const dots=m.closest('.app,.dk-card').querySelectorAll('.dots i');
  const upd=()=>{const i=Math.round(t.scrollLeft/Math.max(1,t.clientWidth)); cnt.textContent=(i+1)+'/'+n; pv.hidden=i<=0; nx.hidden=i>=n-1; dots.forEach((d,j)=>d.classList.toggle('on',j===i));};
  t.addEventListener('scroll',()=>requestAnimationFrame(upd),{passive:true});
  pv.addEventListener('click',()=>t.scrollBy({left:-t.clientWidth}));
  nx.addEventListener('click',()=>t.scrollBy({left:t.clientWidth}));
  t.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();t.scrollBy({left:t.clientWidth})} if(e.key==='ArrowLeft'){e.preventDefault();t.scrollBy({left:-t.clientWidth})}});
});}

/* videos: play while on screen (unless reduced motion); select to pause */
let io=null;
const mark=v=>{const o=v.parentElement.querySelector('.paused'); if(o) o.hidden=!v.paused;};
function initVideos(){
  if(io) io.disconnect();
  const vids=[...document.querySelectorAll('video')];
  vids.forEach(v=>{v.addEventListener('click',()=>{v.paused?v.play().catch(()=>{}):v.pause();}); v.addEventListener('play',()=>mark(v)); v.addEventListener('pause',()=>{mark(v); if(!v.muted) setSound(v,false);});});
  if(!reduce && 'IntersectionObserver' in window){
    io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target; if(e.isIntersecting&&e.intersectionRatio>=.4){v.play().catch(()=>mark(v));} else v.pause();}),{threshold:[0,.4]});
    vids.forEach(v=>io.observe(v));
  }
}

/* sound: videos start muted (browsers only autoplay silently); one video plays sound at a time */
function setSound(v,on){const b=v.parentElement.querySelector('.snd'); v.muted=!on;
  if(b){b.setAttribute('aria-pressed',String(on)); b.setAttribute('aria-label',on?'Turn sound off':'Turn sound on'); b.innerHTML=on?ic('sound'):`${ic('muted')}<span>Tap for sound</span>`;}}
document.addEventListener('click',e=>{const b=e.target.closest('.snd'); if(!b) return; e.stopPropagation();
  const v=b.parentElement.querySelector('video'); const on=v.muted;
  document.querySelectorAll('video').forEach(o=>{if(o!==v&&!o.muted) setSound(o,false);});
  setSound(v,on); if(on&&v.paused) v.play().catch(()=>{});},true);

/* mobile / desktop previews */
function renderMocks(mode){
  const set=mode==='desktop'?RD:R;
  document.querySelectorAll('.mocks[data-pi]').forEach(box=>{
    const p=D.posts[+box.dataset.pi], v=p.variants[+box.dataset.vi];
    box.classList.toggle('dk',mode==='desktop');
    box.innerHTML=PLACE[v.kind].map(([pl,place,fn])=>`<div class="mock"><div class="mock-lbl"><b>${pl}</b> • ${fn==='liVideo'&&v.liFile?'Feed video, 4:5 version':place}${mode==='desktop'?' • Desktop':''}</div>${set[fn](p,v)}</div>`).join('');
  });
  document.querySelectorAll('.mocks[data-pi]').forEach(box=>{const v=D.posts[+box.dataset.pi].variants[+box.dataset.vi]; if(v.aspect) box.querySelectorAll('.media:not(.li-vid)').forEach(m=>m.style.aspectRatio=v.aspect);});
  document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));
  initCarousels(); initVideos();
}
function setMode(mode){
  const navH=document.querySelector('.idx').getBoundingClientRect().bottom;
  const anchor=[...document.querySelectorAll('.post')].find(a=>a.getBoundingClientRect().bottom>navH+40);
  const before=anchor?anchor.getBoundingClientRect().top:0;
  renderMocks(mode);
  if(anchor) window.scrollBy(0,anchor.getBoundingClientRect().top-before);
  try{localStorage.setItem('fwKitView',mode);}catch(_){}
}
let startMode='mobile'; try{if(localStorage.getItem('fwKitView')==='desktop') startMode='desktop';}catch(_){}
renderMocks(startMode);

/* keep the post index in step with scrolling */
const setActive=id=>{jump.value=id; document.querySelectorAll('#idx a').forEach(a=>a.classList.toggle('on',a.dataset.id===id));};
setActive(D.posts[0].id);
let lock=0;
const track=()=>{if(Date.now()<lock) return; const posts=[...document.querySelectorAll('.post')]; const line=document.querySelector('.idx').getBoundingClientRect().bottom+80;
  let cur=posts[0]; posts.forEach(a=>{if(a.getBoundingClientRect().top<=line) cur=a;});
  if(innerHeight+scrollY>=document.documentElement.scrollHeight-4) cur=posts[posts.length-1];
  setActive(cur.id);};
addEventListener('scroll',()=>requestAnimationFrame(track),{passive:true});

/* multi-frame Stories: select to move to the next frame */
function stepStory(st){const fr=st.querySelectorAll('img.st-f'), bars=st.querySelectorAll('.bars i'); const i=((+st.dataset.story)+1)%fr.length; st.dataset.story=i;
  fr.forEach((f,j)=>f.classList.toggle('on',j===i)); bars.forEach((b,j)=>{b.classList.toggle('done',j<i); b.classList.toggle('on',j===i);});}
document.addEventListener('keydown',e=>{const st=e.target.closest&&e.target.closest('[data-story]'); if(st&&(e.key==='Enter'||e.key===' ')){e.preventDefault(); stepStory(st);}});

/* lightbox for grid tiles */
const lb=document.getElementById('lb'), lbImg=document.getElementById('lb-img'), lbCount=document.getElementById('lb-count');
let cur=null, ci=0;
const show=()=>{const f=GAL[cur][ci]; lbImg.src=f.preview; lbImg.alt=f.alt; lbCount.textContent=`Slide ${ci+1} of ${GAL[cur].length}`;};
const step=d=>{ci=(ci+d+GAL[cur].length)%GAL[cur].length; show();};
document.getElementById('lb-prev').onclick=()=>step(-1);
document.getElementById('lb-next').onclick=()=>step(1);
document.getElementById('lb-close').onclick=()=>lb.close();
lb.addEventListener('keydown',e=>{if(e.key==='ArrowRight')step(1); if(e.key==='ArrowLeft')step(-1);});
lb.addEventListener('click',e=>{if(e.target===lb) lb.close();});

/* downloads, copy, "more" */
const toast=document.getElementById('toast'); let tt;
const say=t=>{toast.textContent=t; toast.hidden=false; clearTimeout(tt); tt=setTimeout(()=>toast.hidden=true,3200);};
let dlp=null;
(async()=>{try{dlp=await window.claude?.use?.('downloads');}catch(e){dlp=null}
})();
const fetchBlob=async f=>{const r=await fetch(f); if(!r.ok) throw new Error('fetch'); return r.blob();};
async function save(name,make,btn){
  btn.disabled=true; say('Preparing '+name+'…');
  try{const blob=await make();
    if(dlp){await dlp.save({filename:name,data:blob}); say('Saved '+name+'.');}
    else{const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); say('Downloading '+name+'.');}}
  catch(err){say(err&&err.code==='declined'?'Download canceled.':(err&&err.code==='rate_limited'?'A save prompt is already open. Try again in a moment.':"Couldn't save "+name+'. Try again.'));}
  finally{btn.disabled=false;}
}
document.addEventListener('click',async e=>{
  const st=e.target.closest('[data-story]');
  if(st){stepStory(st); return;}
  const md=e.target.closest('[data-mode]');
  if(md){if(md.getAttribute('aria-pressed')!=='true') setMode(md.dataset.mode); return;}
  const more=e.target.closest('[data-more]');
  if(more){const box=more.closest('.short').parentElement; more.closest('.short').hidden=true; box.querySelector('.full').hidden=false; return;}
  const tile=e.target.closest('[data-gal]');
  if(tile){cur=tile.dataset.gal; ci=+tile.dataset.i; show(); try{lb.showModal();}catch(_){lb.setAttribute('open','');} return;}
  const b=e.target.closest('[data-file]');
  if(b){const f=b.dataset.file, b64=b.dataset.b64;
    return save(f, b64?async()=>{const s=atob((await (await fetch(b64)).text()).trim()); const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return new Blob([u]);}:()=>fetchBlob(f), b);}
  const z=e.target.closest('[data-zip]');
  if(z){const [pid,vi]=z.dataset.zip.split(':'); const v=D.posts.find(p=>p.id===pid).variants[+vi];
    return save(v.zip, async()=>{const zip=new JSZip(); for(const f of v.files) zip.file(f.file, await fetchBlob(f.file)); return zip.generateAsync({type:'blob'});}, z);}
  const c=e.target.closest('[data-copy]');
  if(c){const el=document.getElementById(c.dataset.copy);
    try{await navigator.clipboard.writeText(el.textContent); say('Caption copied.');}
    catch(_){const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); say('Caption selected. Press Ctrl+C or ⌘C to copy.');}}
});
})();
(function(){
const b=document.createElement('button');b.type='button';b.className='totop';b.setAttribute('aria-label','Back to top');
b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>Back to top';
document.body.appendChild(b);
const first=()=>{const el=document.querySelector('.post');return el?el.getBoundingClientRect().top+scrollY+el.offsetHeight*.5:600};
const upd=()=>b.classList.toggle('show',scrollY>first());
addEventListener('scroll',upd,{passive:true});addEventListener('resize',upd);upd();
b.addEventListener('click',()=>{const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;scrollTo({top:0,behavior:rm?'auto':'smooth'});(document.querySelector('.sitenav a,.sitenav button')||document.body).focus?.({preventScroll:true});});
})();
</script>
